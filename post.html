<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="star-yp 的个人博客">
  <title>文章 - star-yp's Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="prefetch" href="https://music.163.com/song/media/outer/url?id=533259686.mp3" as="audio" crossorigin="anonymous">
  <style>
    .post-page {
      max-width: 760px;
      margin: 0 auto;
      padding: var(--space-4xl) var(--space-lg);
      animation: postFadeIn 0.5s ease-out both;
    }
    @keyframes postFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .post-page__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
      text-decoration: none;
      margin-bottom: var(--space-2xl);
      transition: color 0.2s ease;
    }
    .post-page__back:hover { color: var(--color-accent); }
    .post-page__cover {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-bottom: var(--space-2xl);
    }
    .post-page__header { margin-bottom: var(--space-2xl); }
    .post-page__category {
      display: inline-block;
      font-size: var(--text-xs);
      color: var(--color-accent);
      font-weight: 600;
      margin-bottom: var(--space-sm);
    }
    .post-page__title {
      font-size: var(--text-4xl);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-sm);
      color: var(--color-text-primary);
    }
    [data-theme="dark"] .post-page__title {
      text-shadow: 0 0 10px rgba(130,120,255,0.25), 0 0 30px rgba(100,80,240,0.1);
    }
    .post-page__date {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
    }
    .post-page__body {
      font-size: var(--text-base);
      line-height: 2;
      color: var(--color-text-secondary);
    }
    .post-page__body p { margin-bottom: var(--space-lg); }
    .post-page__notfound {
      text-align: center;
      padding: var(--space-4xl);
      color: var(--color-text-tertiary);
    }
  </style>
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>
  <canvas class="particle-bg" id="particleBg" aria-hidden="true"></canvas>
  <div class="bg-orbs" aria-hidden="true">
    <div class="bg-orbs__orb bg-orbs__orb--1"></div>
    <div class="bg-orbs__orb bg-orbs__orb--2"></div>
    <div class="bg-orbs__orb bg-orbs__orb--3"></div>
    <div class="bg-orbs__orb bg-orbs__orb--4"></div>
    <div class="bg-orbs__orb bg-orbs__orb--5"></div>
    <div class="bg-orbs__orb bg-orbs__orb--6"></div>
  </div>
  <div class="theme-overlay" id="themeOverlay" aria-hidden="true"></div>

  <nav class="nav glass--heavy" id="nav">
    <div class="nav__inner container">
      <a href="index.html" class="nav__logo">star-yp</a>
      <div class="nav__actions">
        <button class="nav__theme" id="themeToggle" aria-label="Switch theme">
          <span class="nav__theme-icon nav__theme-icon--sun">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
          </span>
          <span class="nav__theme-icon nav__theme-icon--moon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </nav>

  <main class="post-page" id="postPage">
    <a href="index.html#posts" class="post-page__back">← 返回文章列表</a>
  </main>

  <footer class="footer glass--heavy">
    <div class="container footer__inner">
      <p class="footer__copyright">&copy; 2026 star-yp. All rights reserved.</p>
    </div>
  </footer>

  <!-- ======== 音乐播放器 ======== -->
  <audio id="bgmAudio" preload="auto">
    <source src="https://music.163.com/song/media/outer/url?id=533259686.mp3" type="audio/mpeg">
  </audio>
  <script>
    (() => {
      const key = 'blog_music_state';
      let s;
      try { s = JSON.parse(localStorage.getItem(key)); } catch (e) {}
      if (!s || !s.playing || !s.src) return;
      localStorage.removeItem(key);
      const a = document.getElementById('bgmAudio');
      if (!a) return;
      a.src = s.src;
      a.currentTime = s.currentTime || 0;
      a.play().catch(() => {});
    })();
  </script>
  <div class="music-player glass--heavy tilt-card" id="musicPlayer">
    <div class="music-player__header">
      <div class="music-player__album">
        <div class="music-player__album-art" id="musicAlbumArt">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="music-player__info">
          <span class="music-player__title" id="musicTitle">点击播放</span>
          <span class="music-player__artist" id="musicArtist">BGM</span>
        </div>
      </div>
    </div>
    <div class="music-player__progress">
      <span class="music-player__time" id="musicCurTime">0:00</span>
      <input type="range" class="music-player__seek" id="musicSeek" min="0" max="100" value="0" step="0.1">
      <span class="music-player__time" id="musicDurTime">0:00</span>
    </div>
    <div class="music-player__controls">
      <button class="music-player__btn" id="musicPrev" aria-label="上一首">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button class="music-player__btn music-player__btn--play" id="musicPlay" aria-label="播放">
        <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        <svg class="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
      </button>
      <button class="music-player__btn" id="musicNext" aria-label="下一首">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button class="music-player__btn" id="musicLyrics" aria-label="歌词">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="18" x2="12" y2="18"/></svg>
      </button>
    </div>
    <div class="music-player__lyrics" id="musicLyricsPanel">
      <div class="music-player__lyrics-inner" id="musicLyricsInner"></div>
      <div class="music-player__lyrics-tune" id="musicLyricsTune">
        <button class="music-player__tune-btn" id="lyricsSlower" aria-label="歌词延后">◂</button>
        <span class="music-player__tune-val" id="lyricsOffsetVal">0s</span>
        <button class="music-player__tune-btn" id="lyricsFaster" aria-label="歌词提前">▸</button>
      </div>
    </div>
    <div class="music-player__viz" id="musicViz" aria-hidden="true">
      <span class="viz-bar" style="--h:0.6;--d:0.6s"></span>
      <span class="viz-bar" style="--h:0.35;--d:0.45s"></span>
      <span class="viz-bar" style="--h:0.8;--d:0.7s"></span>
      <span class="viz-bar" style="--h:0.45;--d:0.5s"></span>
      <span class="viz-bar" style="--h:0.9;--d:0.65s"></span>
      <span class="viz-bar" style="--h:0.55;--d:0.55s"></span>
      <span class="viz-bar" style="--h:0.7;--d:0.75s"></span>
      <span class="viz-bar" style="--h:0.4;--d:0.48s"></span>
      <span class="viz-bar" style="--h:0.85;--d:0.68s"></span>
      <span class="viz-bar" style="--h:0.5;--d:0.52s"></span>
      <span class="viz-bar" style="--h:0.75;--d:0.62s"></span>
      <span class="viz-bar" style="--h:0.3;--d:0.42s"></span>
      <span class="viz-bar" style="--h:0.95;--d:0.72s"></span>
      <span class="viz-bar" style="--h:0.65;--d:0.58s"></span>
      <span class="viz-bar" style="--h:0.5;--d:0.54s"></span>
      <span class="viz-bar" style="--h:0.8;--d:0.66s"></span>
      <span class="viz-bar" style="--h:0.35;--d:0.44s"></span>
      <span class="viz-bar" style="--h:0.7;--d:0.64s"></span>
      <span class="viz-bar" style="--h:0.55;--d:0.56s"></span>
      <span class="viz-bar" style="--h:0.9;--d:0.7s"></span>
    </div>
  </div>

  <!-- ======== 回到顶部 ======== -->
  <button class="scroll-top glass--light" id="scrollTop" aria-label="Scroll to top">
    <svg class="scroll-top__ring" width="48" height="48" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.12"/>
      <circle class="scroll-top__ring-fill" cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="131.95" stroke-dashoffset="131.95" transform="rotate(-90 24 24)"/>
    </svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>

  <div class="click-particles" id="clickParticles" aria-hidden="true"></div>

  <script src="js/posts.js"></script>
  <script src="js/playlist.js"></script>
  <script src="js/lyrics.js"></script>
  <script src="js/script.js"></script>
  <script>
    // Theme init (before DOMContentLoaded to prevent flash)
    (() => {
      const theme = localStorage.getItem('blog_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
    // Shared: render a post into the page
    function renderPost(post, addToHistory) {
      const page = document.getElementById('postPage');
      const backLink = '<a href="index.html" class="post-page__back">← 返回文章列表</a>';
      if (post) {
        document.title = post.title + ' - star-yp\'s Blog';
        page.innerHTML = backLink + `
          <article style="animation:postFadeIn 0.35s ease-out both">
            ${post.cover ? `<img class="post-page__cover" src="${post.cover}" alt="">` : ''}
            <header class="post-page__header">
              <h1 class="post-page__title">${post.title}</h1>
              ${post.tags ? `<div class="post-page__tags">${post.tags.map(t => `<span class="post-page__tag">#${t}</span>`).join('')}</div>` : ''}
              <time class="post-page__date" datetime="${post.date}">${post.date}</time>
            </header>
            <div class="post-page__body">
              ${post.content.map(p => `<p>${p}</p>`).join('')}
            </div>
          </article>
        `;
      } else {
        page.innerHTML = backLink + '<p class="post-page__notfound">文章未找到 😕</p>';
      }
      if (addToHistory) {
        history.pushState({ postId: post ? post.id : null }, '', 'post.html?id=' + (post ? post.id : ''));
      }
      window.scrollTo(0, 0);
    }

    // Progress bar animation
    function animateProgressBar() {
      const bar = document.getElementById('progressBar');
      if (!bar) return;
      bar.classList.remove('progress-bar--done');
      bar.style.width = '0%';
      let width = 0;
      const step = () => {
        if (width < 60) {
          width += (60 - width) * 0.2 + 3;
          bar.style.width = Math.min(width, 60) + '%';
          requestAnimationFrame(() => setTimeout(step, 60));
        } else if (width < 85) {
          width += (85 - width) * 0.06;
          bar.style.width = Math.min(width, 85) + '%';
          requestAnimationFrame(() => setTimeout(step, 120));
        }
      };
      step();
      return () => { bar.classList.add('progress-bar--done'); };
    }

    // Initial load
    (() => {
      const done = animateProgressBar();
      window.addEventListener('load', done);
      document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const post = (typeof BLOG_POSTS !== 'undefined' ? BLOG_POSTS : []).find(p => p.id === id);
        history.replaceState({ postId: id || null }, '', 'post.html?id=' + (id || ''));
        renderPost(post, false);
      });
    })();

    // Inter-post navigation: intercept clicks to post.html?id=xxx, swap content without reload
    document.addEventListener('click', function(e) {
      const link = e.target.closest('a[href]');
      if (!link) return;
      const href = link.getAttribute('href');
      if (!href || !href.startsWith('post.html?id=')) return;
      e.preventDefault();
      const params = new URLSearchParams(href.split('?')[1]);
      const id = params.get('id');
      const post = (typeof BLOG_POSTS !== 'undefined' ? BLOG_POSTS : []).find(p => p.id === id);
      if (!post) return;
      const done = animateProgressBar();
      // small delay so progress bar is visible
      setTimeout(() => {
        renderPost(post, true);
        done();
      }, 180);
    });

    // Browser back/forward between posts
    window.addEventListener('popstate', function(e) {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const post = (typeof BLOG_POSTS !== 'undefined' ? BLOG_POSTS : []).find(p => p.id === id);
      renderPost(post, false);
    });
  </script>
</body>
</html>
